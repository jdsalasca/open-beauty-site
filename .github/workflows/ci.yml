name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Generate examples
        run: pnpm examples

      - name: Generate education pages
        run: pnpm education

      - name: Generate showcase styles
        run: pnpm showcase

      - name: Build comparison page
        run: pnpm compare

      - name: Validate examples
        run: |
          node dist/cli.js validate examples/renaissance/index.html --style renaissance --strict
          node dist/cli.js validate examples/brutalist/index.html --style brutalist --strict
          node dist/cli.js validate examples/papercraft/index.html --style papercraft --strict
          node dist/cli.js validate examples/education/renaissance-perspective.html --style renaissance --strict
          node dist/cli.js validate examples/education/papercraft-museum.html --style papercraft --strict
          node dist/cli.js validate examples/showcase/artdeco/index.html --style artdeco --strict
          node dist/cli.js validate examples/showcase/isotype/index.html --style isotype --strict
          node dist/cli.js validate examples/showcase/opart/index.html --style opart --strict
          node dist/cli.js validate examples/showcase/ukiyoe/index.html --style ukiyoe --strict
          node dist/cli.js validate examples/showcase/bestiary/index.html --style bestiary --strict
          node dist/cli.js validate examples/showcase/psychedelic/index.html --style psychedelic --strict
          node dist/cli.js validate examples/showcase/memphis/index.html --style memphis --strict
          node dist/cli.js validate examples/showcase/vaporwave/index.html --style vaporwave --strict
          node dist/cli.js validate examples/showcase/galactic/index.html --style galactic --strict
          node dist/cli.js validate examples/luna-deck/memory-future.html --style galactic --strict
          node dist/cli.js validate examples/experiences/casa-perla.html --style papercraft --strict
          node dist/cli.js validate examples/experiences/museo-invisible.html --style galactic --strict
          node dist/cli.js validate examples/stories/casa-respira.html --style renaissance --strict
          node dist/cli.js validate examples/stories/rio-1870.html --style isotype --strict
          node dist/cli.js validate examples/agile/sprint-14-review.html --style artdeco --strict
          node dist/cli.js validate examples/agile/sprint-14-retro.html --style memphis --strict
          node dist/cli.js validate examples/agile/sprint-15-planning.html --style isotype --strict
