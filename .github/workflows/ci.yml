name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Generate examples
        run: pnpm examples

      - name: Validate examples
        run: |
          node dist/cli.js validate examples/renaissance/index.html --style renaissance --strict
          node dist/cli.js validate examples/brutalist/index.html --style brutalist --strict
          node dist/cli.js validate examples/papercraft/index.html --style papercraft --strict
