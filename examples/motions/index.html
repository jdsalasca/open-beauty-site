<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motions · trece pósters que respiran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400&family=Karla:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#EFE9D8;--ink:#243026;--muted:#5A6450;--moss:#7A8B4F;--clay:#B55239;--line:rgba(36,48,38,.24)}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Karla',sans-serif;line-height:1.6}
  .wrap{width:min(1280px,92vw);margin:0 auto;padding:32px 0 70px}
  header{display:flex;justify-content:space-between;gap:18px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:16px}
  .brand{font:600 11px/1.2 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase}.brand span{color:var(--moss)}
  header p{margin:0;font:10px/1.4 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .intro{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:end;padding:56px 0 42px}
  h1{font-family:'Cormorant Garamond',serif;font-size:clamp(48px,7vw,96px);line-height:.94;font-weight:400;margin:0;max-width:11ch}h1 em{color:var(--moss)}
  .intro p{margin:0;max-width:40ch;color:var(--muted);font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  .card{margin:0;background:rgba(255,248,234,.56);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 18px 30px rgba(74,58,50,.12)}
  .card.wide{grid-column:1/-1}
  .card .frame{display:flex;align-items:center;justify-content:center;background:#141B15;border-radius:9px;overflow:hidden;min-height:220px}
  .card img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain}
  figcaption{display:flex;justify-content:space-between;gap:12px;padding:10px 2px 2px;font:9px/1.4 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  figcaption b{color:var(--ink);font-weight:400}
  footer{margin-top:46px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:16px;font:9px/1.5 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  @media(max-width:800px){.grid{grid-template-columns:1fr}.intro{grid-template-columns:1fr;gap:22px}.card.wide{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">OPEN<span>/</span>BEAUTY · MOTION ARCHIVE</div><p>13 SVG loops · Luna 6 Max · maxxing</p></header>
  <section class="intro"><h1>Pósters que <em>respiran.</em></h1><p>Trece loops SVG originales, uno por estilo. No hay video, ni GIF, ni stock: hay una escena, una tipografía y una duración. Abrí cualquiera y dejalo vivir un minuto.</p></section>
  <main class="grid">
    <figure class="card wide"><div class="frame"><img src="el-jardin-de-las-horas-lentas.svg" alt="Póster SVG Nature Memory: El jardín de las horas lentas"></div><figcaption><b>Nature Memory</b><span>bloom · 16 s</span></figcaption></figure>
    <figure class="card"><div class="frame" style="background:#02030A"><img src="memoria-orbital.svg" alt="Póster SVG Galactic: Memoria orbital"></div><figcaption><b>Galactic Futurism</b><span>orbit · 16 s</span></figcaption></figure>
    <figure class="card"><div class="frame" style="background:#141B15"><img src="subir-la-ciudad-vertical.svg" alt="Póster SVG Art Deco: Subir"></div><figcaption><b>Art Deco</b><span>ribbon · 16 s</span></figcaption></figure>
    <figure class="card"><div class="frame" style="background:#FBF1E2"><img src="pequenas-cosas.svg" alt="Póster SVG Paper Craft: Pequeñas cosas"></div><figcaption><b>Paper Craft</b><span>papercut · 16 s</span></figcaption></figure>
    <figure class="card"><div class="frame" style="background:#F5E7CE"><img src="la-ola-que-se-repite.svg" alt="Póster SVG Ukiyo-e: La ola que se repite"></div><figcaption><b>Ukiyo-e</b><span>tide · 16 s</span></figcaption></figure>

    <figure class="card"><div class="frame" style="background:#F6EDDD"><img src="la-ciudad-ideal.svg" alt="Póster SVG Renaissance: La ciudad ideal"></div><figcaption><b>Renaissance</b><span>ribbon · 16 s</span></figcaption></figure>
    <figure class="card"><div class="frame" style="background:#E8E4D9"><img src="no-esperes.svg" alt="Póster SVG Brutalist: NO ESPERES"></div><figcaption><b>Brutalist</b><span>type · 16 s</span></figcaption></figure>
    <figure class="card"><div class="frame" style="background:#F3E9D2"><img src="uno-de-cada-cuatro.svg" alt="Póster SVG Isotype: Uno de cada cuatro"></div><figcaption><b>Isotype</b><span>orbit · 16 s</span></figcaption></figure>
    <figure class="card"><div class="frame" style="background:#0B0B0B"><img src="mira-dos-veces.svg" alt="Póster SVG Op Art: Mirá dos veces"></div><figcaption><b>Op Art</b><span>type · 16 s</span></figcaption></figure>
    <figure class="card"><div class="frame" style="background:#241D15"><img src="animal-inexistente.svg" alt="Póster SVG Bestiario: Animal inexistente"></div><figcaption><b>Bestiario</b><span>constellation · 16 s</span></figcaption></figure>
    <figure class="card"><div class="frame" style="background:#1B1038"><img src="color-liquido.svg" alt="Póster SVG Psicodelia: Color líquido"></div><figcaption><b>Psicodelia</b><span>bloom · 16 s</span></figcaption></figure>
    <figure class="card"><div class="frame" style="background:#FBF1E2"><img src="mal-gusto.svg" alt="Póster SVG Memphis: Mal gusto"></div><figcaption><b>Memphis</b><span>ribbon · 16 s</span></figcaption></figure>
    <figure class="card"><div class="frame" style="background:#0A1030"><img src="1999.svg" alt="Póster SVG Vaporwave: 1999"></div><figcaption><b>Vaporwave / Y2K</b><span>rain · 16 s</span></figcaption></figure>
  </main>
  <footer><span>Open Beauty · Motion</span><span><a href="../index.html" style="color:var(--moss)">Volver a la galería</a></span></footer>
</div>
</body>
</html>
