<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="m-title m-desc">
  <title id="m-title">Color líquido</title>
  <desc id="m-desc">Un cartel para no dormir. Animated SVG; respects reduced motion.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Bungee+Shade&amp;family=Space+Grotesk:wght@400;500&amp;display=swap');:root{--dur:16s}
  .anim,.spin-slow,.drift-slow,.breathe,.twinkle,.rain-drop,.tide-band,.ribbon,.bloom-petal{transform-box:fill-box;transform-origin:center}
  .title{animation:title-in 1.2s cubic-bezier(.22,.61,.36,1) both}
  .kicker,.subtitle,.rule{animation:fade-in 1.4s ease both}
  .subtitle{animation-delay:.25s}.rule{animation-delay:.45s}
  .spin-slow{animation:spin var(--dur) linear infinite}
  .drift-slow{animation:drift var(--dur) ease-in-out infinite alternate}
  .breathe{animation:breathe calc(var(--dur) * .72) ease-in-out infinite}
  .twinkle{animation:twinkle calc(var(--dur) * .45) ease-in-out infinite;animation-delay:calc(var(--i) * -.4s)}
  .bloom-petal{animation:bloom calc(var(--dur) * .9) cubic-bezier(.22,.61,.36,1) infinite alternate;animation-delay:calc(var(--i) * -.18s)}
  .tide-band{animation:tide calc(var(--dur) * .8) ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.6s)}
  .rain-drop{animation:rain calc(var(--dur) * .55) linear infinite;animation-delay:calc(var(--i) * -.2s)}
  .ribbon{animation:ribbon calc(var(--dur) * .9) ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.5s)}
  .orbit-stage{animation:float calc(var(--dur) * 1.2) ease-in-out infinite alternate}
  @keyframes title-in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes drift{from{transform:translate3d(-8px,4px,0)}to{transform:translate3d(12px,-8px,0)}}
  @keyframes breathe{0%,100%{transform:scale(.96);opacity:.8}50%{transform:scale(1.04);opacity:1}}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  @keyframes bloom{from{transform:scale(.86) rotate(-3deg)}to{transform:scale(1.06) rotate(3deg)}}
  @keyframes tide{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
  @keyframes rain{from{transform:translateY(-18px);opacity:.2}to{transform:translateY(22px);opacity:.8}}
  @keyframes ribbon{from{transform:rotate(-.5deg)}to{transform:rotate(.8deg)}}
  @keyframes float{from{transform:translateY(-4px)}to{transform:translateY(6px)}}
  @media (prefers-reduced-motion:reduce){.anim,.spin-slow,.drift-slow,.breathe,.twinkle,.rain-drop,.tide-band,.ribbon,.bloom-petal,.orbit-stage,.title,.kicker,.subtitle,.rule{animation:none!important;transform:none!important;opacity:1!important}}</style>
  <rect width="1200" height="1200" fill="#1B1B3A"/>
  <g opacity=".32"><path d="M816.0000000000001 96c192-72 336.00000000000006 120 240 264s-240 96-312 216" fill="none" stroke="#FF6B1A" stroke-width="30"/></g>
  <g class="stage"><g class="bloom-stage" transform-origin="768 528">
        <ellipse cx="878.88" cy="528" rx="110.88" ry="50.160000000000004" fill="#00A6A6" opacity=".82" transform="rotate(0 768 528)" class="bloom-petal" style="--i:0"/><ellipse cx="823.44" cy="624.0248967716185" rx="110.88" ry="50.160000000000004" fill="#E5197F" opacity=".82" transform="rotate(60 768 528)" class="bloom-petal" style="--i:1"/><ellipse cx="712.5600000000001" cy="624.0248967716186" rx="110.88" ry="50.160000000000004" fill="#00A6A6" opacity=".82" transform="rotate(120 768 528)" class="bloom-petal" style="--i:2"/><ellipse cx="657.12" cy="528" rx="110.88" ry="50.160000000000004" fill="#E5197F" opacity=".82" transform="rotate(180 768 528)" class="bloom-petal" style="--i:3"/><ellipse cx="712.56" cy="431.9751032283815" rx="110.88" ry="50.160000000000004" fill="#00A6A6" opacity=".82" transform="rotate(240 768 528)" class="bloom-petal" style="--i:4"/><ellipse cx="823.44" cy="431.97510322838144" rx="110.88" ry="50.160000000000004" fill="#E5197F" opacity=".82" transform="rotate(300 768 528)" class="bloom-petal" style="--i:5"/>
        <circle cx="768" cy="528" r="58.08" fill="#FF6B1A"/><g opacity=".35" fill="none" stroke="#00A6A6" stroke-width="1.5"><circle cx="768" cy="528" r="382.8"/><circle cx="768" cy="528" r="448.8"/></g>
        <g class="drift-slow" style="--dur:18s"><path d="M732 844.8v237.6" stroke="#F7E8C8" stroke-width="2"/><path d="M732 950.4000000000001c-79.2 0-105.60000000000001-52.800000000000004-105.60000000000001-92.39999999999999 52.800000000000004 0 105.60000000000001 26.400000000000002 105.60000000000001 92.39999999999999Z" fill="#F5E13B"/></g>
      </g></g>

  <g class="title-block">
    <text class="kicker anim" x="96" y="772.8000000000001" text-anchor="start" font-family="Space Grotesk" font-size="15" letter-spacing="4" fill="#F7E8C8" opacity=".7">1967 · SINCRONÍA</text>
    <text class="title anim" x="96" y="864" text-anchor="start" font-family="Bungee Shade" font-size="79.99999999999999" letter-spacing=".02em" fill="#F7E8C8" style="text-transform:uppercase"><tspan x="96" dy="0">Color líquido</tspan></text>
    <text class="subtitle anim" x="96" y="937.6" text-anchor="start" font-family="Space Grotesk" font-size="18" fill="#F7E8C8" opacity=".78">Un cartel para no dormir</text>
    <g class="rule anim" aria-hidden="true"><path d="M96 956.4h170" stroke="#E5197F" stroke-width="0"/></g>
  </g>
  <text x="1104" y="90" text-anchor="end" font-family="Space Grotesk" font-size="13" letter-spacing="3" fill="#F7E8C8" opacity=".7">OPEN/BEAUTY</text><text x="96" y="1182" font-family="Space Grotesk" font-size="12" letter-spacing="2" fill="#F7E8C8" opacity=".6">SVG original · sin stock</text><filter id="m-grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1200" height="1200" filter="url(#m-grain)" opacity=".035"/>
</svg>
