<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="m-title m-desc">
  <title id="m-title">Uno de cada cuatro</title>
  <desc id="m-desc">La información también es una forma de cuidar. Animated SVG; respects reduced motion.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&amp;family=Jost:wght@400;500;700&amp;display=swap');:root{--dur:16s}
  .anim,.spin-slow,.drift-slow,.breathe,.twinkle,.rain-drop,.tide-band,.ribbon,.bloom-petal{transform-box:fill-box;transform-origin:center}
  .title{animation:title-in 1.2s cubic-bezier(.22,.61,.36,1) both}
  .kicker,.subtitle,.rule{animation:fade-in 1.4s ease both}
  .subtitle{animation-delay:.25s}.rule{animation-delay:.45s}
  .spin-slow{animation:spin var(--dur) linear infinite}
  .drift-slow{animation:drift var(--dur) ease-in-out infinite alternate}
  .breathe{animation:breathe calc(var(--dur) * .72) ease-in-out infinite}
  .twinkle{animation:twinkle calc(var(--dur) * .45) ease-in-out infinite;animation-delay:calc(var(--i) * -.4s)}
  .bloom-petal{animation:bloom calc(var(--dur) * .9) cubic-bezier(.22,.61,.36,1) infinite alternate;animation-delay:calc(var(--i) * -.18s)}
  .tide-band{animation:tide calc(var(--dur) * .8) ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.6s)}
  .rain-drop{animation:rain calc(var(--dur) * .55) linear infinite;animation-delay:calc(var(--i) * -.2s)}
  .ribbon{animation:ribbon calc(var(--dur) * .9) ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.5s)}
  .orbit-stage{animation:float calc(var(--dur) * 1.2) ease-in-out infinite alternate}
  @keyframes title-in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes drift{from{transform:translate3d(-8px,4px,0)}to{transform:translate3d(12px,-8px,0)}}
  @keyframes breathe{0%,100%{transform:scale(.96);opacity:.8}50%{transform:scale(1.04);opacity:1}}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  @keyframes bloom{from{transform:scale(.86) rotate(-3deg)}to{transform:scale(1.06) rotate(3deg)}}
  @keyframes tide{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
  @keyframes rain{from{transform:translateY(-18px);opacity:.2}to{transform:translateY(22px);opacity:.8}}
  @keyframes ribbon{from{transform:rotate(-.5deg)}to{transform:rotate(.8deg)}}
  @keyframes float{from{transform:translateY(-4px)}to{transform:translateY(6px)}}
  @media (prefers-reduced-motion:reduce){.anim,.spin-slow,.drift-slow,.breathe,.twinkle,.rain-drop,.tide-band,.ribbon,.bloom-petal,.orbit-stage,.title,.kicker,.subtitle,.rule{animation:none!important;transform:none!important;opacity:1!important}}</style>
  <rect width="1600" height="1000" fill="#1C1C1C"/>
  <g fill="#B53328" opacity=".32"><circle cx="128" cy="120" r="14.399999999999999"/><circle cx="200" cy="120" r="14.399999999999999"/><circle cx="272" cy="120" r="14.399999999999999"/><circle cx="344" cy="120" r="14.399999999999999"/><circle cx="416" cy="120" r="14.399999999999999"/><circle cx="488" cy="120" r="14.399999999999999"/><circle cx="128" cy="170" r="14.399999999999999"/><circle cx="200" cy="170" r="14.399999999999999"/><circle cx="272" cy="170" r="14.399999999999999"/><circle cx="344" cy="170" r="14.399999999999999"/><circle cx="416" cy="170" r="14.399999999999999"/><circle cx="488" cy="170" r="14.399999999999999"/></g>
  <g class="stage"><g class="orbit-stage">
        <g class="spin-slow" style="--dur:42s" transform-origin="1024 440"><ellipse cx="1024" cy="440" rx="374" ry="114.4" fill="none" stroke="#D9A441" stroke-width="2" transform="rotate(-18 1024 440)"/><ellipse cx="1024" cy="440" rx="297" ry="88" fill="none" stroke="#8C8C8C" stroke-width="1.4" transform="rotate(32 1024 440)"/></g>
        <circle class="breathe" cx="1024" cy="440" r="220" fill="#2A7F7A" opacity=".92"/>
        <circle cx="971.2" cy="391.6" r="110" fill="#8C8C8C" opacity=".38"/>
        <g class="drift-slow" style="--dur:16s"><circle cx="1376" cy="253" r="13.2" fill="#8C8C8C"/><circle cx="694" cy="572" r="6.6" fill="#D9A441"/></g><g opacity=".35" fill="none" stroke="#8C8C8C" stroke-width="1.5"><circle cx="1024" cy="440" r="319"/><circle cx="1024" cy="440" r="374"/></g>
      </g></g>

  <g class="title-block">
    <text class="kicker anim" x="128" y="632.1777777777778" text-anchor="start" font-family="IBM Plex Sans" font-size="15" letter-spacing="4" fill="#E7DFC9" opacity=".7">VIENA · 1925</text>
    <text class="title anim" x="128" y="720" text-anchor="start" font-family="Jost" font-size="77.03703703703704" letter-spacing="-.02em" fill="#E7DFC9" style="text-transform:none"><tspan x="128" dy="0">Uno de cada cuatro</tspan></text>
    <text class="subtitle anim" x="128" y="791.762962962963" text-anchor="start" font-family="IBM Plex Sans" font-size="18" fill="#E7DFC9" opacity=".78">La información también es una forma de cuidar</text>
    <g class="rule anim" aria-hidden="true"><path d="M128 810.0888888888888h170" stroke="#B53328" stroke-width="1"/></g>
  </g>
  <text x="1472" y="75" text-anchor="end" font-family="IBM Plex Sans" font-size="13" letter-spacing="3" fill="#E7DFC9" opacity=".7">OPEN/BEAUTY</text><text x="128" y="985" font-family="IBM Plex Sans" font-size="12" letter-spacing="2" fill="#E7DFC9" opacity=".6">SVG original · sin stock</text><filter id="m-grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1600" height="1000" filter="url(#m-grain)" opacity=".035"/>
</svg>
