<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="m-title m-desc">
  <title id="m-title">La ciudad ideal</title>
  <desc id="m-desc">Una perspectiva para mirar el poder. Animated SVG; respects reduced motion.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;display=swap');:root{--dur:16s}
  .anim,.spin-slow,.drift-slow,.breathe,.twinkle,.rain-drop,.tide-band,.ribbon,.bloom-petal{transform-box:fill-box;transform-origin:center}
  .title{animation:title-in 1.2s cubic-bezier(.22,.61,.36,1) both}
  .kicker,.subtitle,.rule{animation:fade-in 1.4s ease both}
  .subtitle{animation-delay:.25s}.rule{animation-delay:.45s}
  .spin-slow{animation:spin var(--dur) linear infinite}
  .drift-slow{animation:drift var(--dur) ease-in-out infinite alternate}
  .breathe{animation:breathe calc(var(--dur) * .72) ease-in-out infinite}
  .twinkle{animation:twinkle calc(var(--dur) * .45) ease-in-out infinite;animation-delay:calc(var(--i) * -.4s)}
  .bloom-petal{animation:bloom calc(var(--dur) * .9) cubic-bezier(.22,.61,.36,1) infinite alternate;animation-delay:calc(var(--i) * -.18s)}
  .tide-band{animation:tide calc(var(--dur) * .8) ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.6s)}
  .rain-drop{animation:rain calc(var(--dur) * .55) linear infinite;animation-delay:calc(var(--i) * -.2s)}
  .ribbon{animation:ribbon calc(var(--dur) * .9) ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.5s)}
  .orbit-stage{animation:float calc(var(--dur) * 1.2) ease-in-out infinite alternate}
  @keyframes title-in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes drift{from{transform:translate3d(-8px,4px,0)}to{transform:translate3d(12px,-8px,0)}}
  @keyframes breathe{0%,100%{transform:scale(.96);opacity:.8}50%{transform:scale(1.04);opacity:1}}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  @keyframes bloom{from{transform:scale(.86) rotate(-3deg)}to{transform:scale(1.06) rotate(3deg)}}
  @keyframes tide{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
  @keyframes rain{from{transform:translateY(-18px);opacity:.2}to{transform:translateY(22px);opacity:.8}}
  @keyframes ribbon{from{transform:rotate(-.5deg)}to{transform:rotate(.8deg)}}
  @keyframes float{from{transform:translateY(-4px)}to{transform:translateY(6px)}}
  @media (prefers-reduced-motion:reduce){.anim,.spin-slow,.drift-slow,.breathe,.twinkle,.rain-drop,.tide-band,.ribbon,.bloom-petal,.orbit-stage,.title,.kicker,.subtitle,.rule{animation:none!important;transform:none!important;opacity:1!important}}</style>
  <rect width="1600" height="1000" fill="#F6EDDD"/>
  <g fill="none" stroke="#B4432C" stroke-width="1.2" opacity=".38"><path d="M1248 1000V340c0-160 160-240 256-240s256 80 256 240V1000"/></g>
  <g class="stage"><g class="ribbon-stage"><path class="ribbon" style="--i:0" d="M896.0000000000001 80c320 120-256 250 32 400s320 280 -64 440" fill="none" stroke="#B9C4A6" stroke-width="18" opacity=".75"/><path class="ribbon" style="--i:1" d="M944.0000000000001 80c320 120-256 250 32 400s320 280 -64 440" fill="none" stroke="#B4432C" stroke-width="13" opacity=".75"/><path class="ribbon" style="--i:2" d="M992.0000000000002 80c320 120-256 250 32 400s320 280 -64 440" fill="none" stroke="#B9C4A6" stroke-width="8" opacity=".75"/><g opacity=".35" fill="none" stroke="#B9C4A6" stroke-width="1.5"><circle cx="1024" cy="440" r="319"/><circle cx="1024" cy="440" r="374"/></g></g></g>
  <g class="title-block">
    <text class="kicker anim" x="128" y="614.6133333333333" text-anchor="start" font-family="EB Garamond" font-size="15" letter-spacing="4" fill="#2B211B" opacity=".7">RENACIMIENTO · 1480</text>
    <text class="title anim" x="128" y="720" text-anchor="start" font-family="EB Garamond" font-size="92.44444444444444" letter-spacing=".01em" fill="#2B211B" style="text-transform:none"><tspan x="128" dy="0">La ciudad ideal</tspan></text>
    <text class="subtitle anim" x="128" y="801.3155555555555" text-anchor="start" font-family="EB Garamond" font-size="18" fill="#2B211B" opacity=".78">Una perspectiva para mirar el poder</text>
    <g class="rule anim" aria-hidden="true"><path d="M128 822.1066666666667h170" stroke="#B08A4F" stroke-width="1"/></g>
  </g>
  <text x="1472" y="75" text-anchor="end" font-family="EB Garamond" font-size="13" letter-spacing="3" fill="#2B211B" opacity=".7">OPEN/BEAUTY</text><text x="128" y="940" font-family="EB Garamond" font-size="12" letter-spacing="2" fill="#2B211B" opacity=".6">SVG original · sin stock</text><filter id="m-grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1600" height="1000" filter="url(#m-grain)" opacity=".035"/>
</svg>