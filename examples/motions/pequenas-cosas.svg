<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="m-title m-desc">
  <title id="m-title">Pequeñas cosas</title>
  <desc id="m-desc">Un museo de papel para mirar de cerca. Animated SVG; respects reduced motion.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&amp;family=Nunito+Sans:opsz,wght@6..12,200..1000&amp;display=swap');:root{--dur:16s}
  .anim,.spin-slow,.drift-slow,.breathe,.twinkle,.rain-drop,.tide-band,.ribbon,.bloom-petal{transform-box:fill-box;transform-origin:center}
  .title{animation:title-in 1.2s cubic-bezier(.22,.61,.36,1) both}
  .kicker,.subtitle,.rule{animation:fade-in 1.4s ease both}
  .subtitle{animation-delay:.25s}.rule{animation-delay:.45s}
  .spin-slow{animation:spin var(--dur) linear infinite}
  .drift-slow{animation:drift var(--dur) ease-in-out infinite alternate}
  .breathe{animation:breathe calc(var(--dur) * .72) ease-in-out infinite}
  .twinkle{animation:twinkle calc(var(--dur) * .45) ease-in-out infinite;animation-delay:calc(var(--i) * -.4s)}
  .bloom-petal{animation:bloom calc(var(--dur) * .9) cubic-bezier(.22,.61,.36,1) infinite alternate;animation-delay:calc(var(--i) * -.18s)}
  .tide-band{animation:tide calc(var(--dur) * .8) ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.6s)}
  .rain-drop{animation:rain calc(var(--dur) * .55) linear infinite;animation-delay:calc(var(--i) * -.2s)}
  .ribbon{animation:ribbon calc(var(--dur) * .9) ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.5s)}
  .orbit-stage{animation:float calc(var(--dur) * 1.2) ease-in-out infinite alternate}
  @keyframes title-in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes drift{from{transform:translate3d(-8px,4px,0)}to{transform:translate3d(12px,-8px,0)}}
  @keyframes breathe{0%,100%{transform:scale(.96);opacity:.8}50%{transform:scale(1.04);opacity:1}}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  @keyframes bloom{from{transform:scale(.86) rotate(-3deg)}to{transform:scale(1.06) rotate(3deg)}}
  @keyframes tide{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
  @keyframes rain{from{transform:translateY(-18px);opacity:.2}to{transform:translateY(22px);opacity:.8}}
  @keyframes ribbon{from{transform:rotate(-.5deg)}to{transform:rotate(.8deg)}}
  @keyframes float{from{transform:translateY(-4px)}to{transform:translateY(6px)}}
  @media (prefers-reduced-motion:reduce){.anim,.spin-slow,.drift-slow,.breathe,.twinkle,.rain-drop,.tide-band,.ribbon,.bloom-petal,.orbit-stage,.title,.kicker,.subtitle,.rule{animation:none!important;transform:none!important;opacity:1!important}}</style>
  <rect width="1600" height="1000" fill="#FBF1E2"/>
  <g opacity=".5"><circle cx="1344" cy="220" r="192" fill="#F2C879"/><circle cx="1440" cy="300" r="80" fill="#B8D4E0"/></g>
  <g class="stage"><g class="paper-stage"><svg x="32" y="40" width="1536" height="620" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet"><svg viewBox="0 0 800 500" role="img" aria-label="Paper Craft" preserveAspectRatio="xMidYMid slice">
    <style>.pc-cloud{animation:pc-cloud 26s ease-in-out infinite alternate}.pc-bird{animation:pc-bird 7s ease-in-out infinite alternate}.pc-sway{animation:pc-sway 6s ease-in-out infinite alternate}@keyframes pc-cloud{to{transform:translateX(18px)}}@keyframes pc-bird{to{transform:translateY(-7px)}}@keyframes pc-sway{to{transform:rotate(1.5deg)}}@media(prefers-reduced-motion:reduce){.pc-cloud,.pc-bird,.pc-sway{animation:none!important}}</style>
    <defs>
      <filter id="pc-paper-pc-7" x="-8%" y="-8%" width="116%" height="126%"><feTurbulence baseFrequency=".035" numOctaves="2" seed="31" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
      <filter id="pc-cut-pc-7" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="1" dy="4" stdDeviation="1.8" flood-color="#4A3A32" flood-opacity=".26"/></filter>
      <filter id="pc-grain-pc-7"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="14"/><feColorMatrix type="saturate" values="0"/></filter>
    </defs>
    <rect width="800" height="500" fill="#B8D4E0"/>
    <g filter="url(#pc-paper-pc-7)">
      <g class="pc-cloud" fill="#FFF8EA" opacity=".85"><ellipse cx="180" cy="96" rx="70" ry="22"/><ellipse cx="240" cy="86" rx="48" ry="18"/><ellipse cx="560" cy="120" rx="86" ry="24"/><ellipse cx="620" cy="110" rx="42" ry="16"/></g>
      <circle cx="680" cy="86" r="42" fill="#F2C879" opacity=".95"/>
      <path d="M0 300c130-45 220 25 330-5s240-20 470 12v193H0Z" fill="#A9C3A0"/><path d="M0 355c160-30 260 20 400-5s260 8 400 18v132H0Z" fill="#A9C3A0"/>
      <path d="M0 300c130-45 220 25 330-5s240-20 470 12" fill="none" stroke="#FFF8EA" stroke-width="2" opacity=".45"/>
      <g transform="translate(130 315)" filter="url(#pc-cut-pc-7)"><rect x="-6" y="38" width="12" height="32" fill="#7C5A72"/><path d="M0-62 40 0H-40Z" fill="#7C5A72"/><path d="M0-34 50 28H-50Z" fill="#7C5A72"/><path d="M0-2 58 62H-58Z" fill="#7C5A72"/><path d="M-2-58 10 0" stroke="#A9C3A0" stroke-width="2" opacity=".5"/></g><g transform="translate(675 302)" filter="url(#pc-cut-pc-7)"><rect x="-7" y="28" width="14" height="42" fill="#7C5A72"/><circle cx="0" cy="-10" r="38" fill="#7C5A72"/><circle cx="-26" cy="6" r="24" fill="#7C5A72"/><circle cx="26" cy="6" r="24" fill="#7C5A72"/><circle cx="-10" cy="-8" r="13" fill="#A9C3A0" opacity=".55"/></g><g transform="translate(180 410)" filter="url(#pc-cut-pc-7)"><g class="pc-sway"><circle cx="-18" cy="0" r="7" fill="#F2C879"/><path d="M-18 8v22" stroke="#A9C3A0" stroke-width="3"/><circle cx="0" cy="-5" r="7" fill="#B8D4E0"/><path d="M0 8v22" stroke="#A9C3A0" stroke-width="3"/><circle cx="18" cy="-10" r="7" fill="#F2C879"/><path d="M18 8v22" stroke="#A9C3A0" stroke-width="3"/></g>
      <g fill="none" stroke="#FFF8EA" stroke-width="2" opacity=".7"><path d="M40 430c16-24 30-24 46 0M700 450c14-22 28-22 42 0M350 455c12-20 24-20 36 0"/></g>
      <g transform="translate(245 390)" filter="url(#pc-cut-pc-7)">
    <ellipse cx="0" cy="36" rx="34" ry="9" fill="#4A3A32" opacity=".14"/>
    <circle cx="34" cy="22" r="11" fill="#FFF8EA"/><ellipse cx="-9" cy="-38" rx="6" ry="23" fill="#FFF8EA" transform="rotate(-12 -9 -38)"/><ellipse cx="10" cy="-38" rx="6" ry="23" fill="#FFF8EA" transform="rotate(13 10 -38)"/><ellipse cx="-9" cy="-38" rx="2.5" ry="15" fill="#B8D4E0" transform="rotate(-12 -9 -38)"/><ellipse cx="10" cy="-38" rx="2.5" ry="15" fill="#B8D4E0" transform="rotate(13 10 -38)"/>
    <ellipse cx="0" cy="17" rx="27" ry="29" fill="#FFF8EA"/>
    <circle cx="0" cy="-13" r="21" fill="#FFF8EA"/>
    <ellipse cx="2" cy="3" rx="13" ry="10" fill="#FFF8EA" opacity=".85"/>
    <circle cx="-8" cy="-16" r="2.2" fill="#4A3A32"/><circle cx="8" cy="-16" r="2.2" fill="#4A3A32"/>
    <path d="M-3 -8h6l-3 4Z" fill="#A9C3A0"/><path d="M-7 27v11M8 27v11" stroke="#4A3A32" stroke-width="2" stroke-linecap="round" opacity=".5"/>
  </g>
      <rect width="800" height="500" filter="url(#pc-grain-pc-7)" opacity=".045"/>
    </g>
  </svg></svg></g></g>

  <g class="title-block">
    <text class="kicker anim" x="128" y="607.0857142857143" text-anchor="start" font-family="Nunito Sans" font-size="15" letter-spacing="4" fill="#4A3A32" opacity=".7">MUSEO DE LAS COSAS PEQUEÑAS</text>
    <text class="title anim" x="128" y="720" text-anchor="start" font-family="Fraunces" font-size="99.04761904761905" letter-spacing=".005em" fill="#4A3A32" style="text-transform:none"><tspan x="128" dy="0">Pequeñas cosas</tspan></text>
    <text class="subtitle anim" x="128" y="805.4095238095238" text-anchor="start" font-family="Nunito Sans" font-size="18.81904761904762" fill="#4A3A32" opacity=".78">Un museo de papel para mirar de cerca</text>
    <g class="rule anim" aria-hidden="true"><path d="M128 827.2571428571429h170" stroke="#CE7256" stroke-width="1"/></g>
  </g>
  <text x="1472" y="75" text-anchor="end" font-family="Nunito Sans" font-size="13" letter-spacing="3" fill="#4A3A32" opacity=".7">OPEN/BEAUTY</text><text x="128" y="985" font-family="Nunito Sans" font-size="12" letter-spacing="2" fill="#4A3A32" opacity=".6">SVG original · sin stock</text><filter id="m-grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1600" height="1000" filter="url(#m-grain)" opacity=".035"/>
</svg>
