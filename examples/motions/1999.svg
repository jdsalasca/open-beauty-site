  <text x="1104" y="90" text-anchor="end" font-family="Space Grotesk" font-size="13" letter-spacing="3" fill="#FFFFFF" opacity=".7">OPEN/BEAUTY</text><text x="96" y="1182" font-family="Space Grotesk" font-size="12" letter-spacing="2" fill="#FFFFFF" opacity=".6">SVG original · sin stock</text><filter id="m-grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1200" height="1200" filter="url(#m-grain)" opacity=".035"/>
