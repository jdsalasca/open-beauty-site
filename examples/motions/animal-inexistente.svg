<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="m-title m-desc">
  <title id="m-title">Animal inexistente</title>
  <desc id="m-desc">Una taxonomía de lo que todavía no tiene nombre. Animated SVG; respects reduced motion.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=UnifrakturMaguntia&amp;display=swap');:root{--dur:16s}
  .anim,.spin-slow,.drift-slow,.breathe,.twinkle,.rain-drop,.tide-band,.ribbon,.bloom-petal{transform-box:fill-box;transform-origin:center}
  .title{animation:title-in 1.2s cubic-bezier(.22,.61,.36,1) both}
  .kicker,.subtitle,.rule{animation:fade-in 1.4s ease both}
  .subtitle{animation-delay:.25s}.rule{animation-delay:.45s}
  .spin-slow{animation:spin var(--dur) linear infinite}
  .drift-slow{animation:drift var(--dur) ease-in-out infinite alternate}
  .breathe{animation:breathe calc(var(--dur) * .72) ease-in-out infinite}
  .twinkle{animation:twinkle calc(var(--dur) * .45) ease-in-out infinite;animation-delay:calc(var(--i) * -.4s)}
  .bloom-petal{animation:bloom calc(var(--dur) * .9) cubic-bezier(.22,.61,.36,1) infinite alternate;animation-delay:calc(var(--i) * -.18s)}
  .tide-band{animation:tide calc(var(--dur) * .8) ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.6s)}
  .rain-drop{animation:rain calc(var(--dur) * .55) linear infinite;animation-delay:calc(var(--i) * -.2s)}
  .ribbon{animation:ribbon calc(var(--dur) * .9) ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.5s)}
  .orbit-stage{animation:float calc(var(--dur) * 1.2) ease-in-out infinite alternate}
  @keyframes title-in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes drift{from{transform:translate3d(-8px,4px,0)}to{transform:translate3d(12px,-8px,0)}}
  @keyframes breathe{0%,100%{transform:scale(.96);opacity:.8}50%{transform:scale(1.04);opacity:1}}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  @keyframes bloom{from{transform:scale(.86) rotate(-3deg)}to{transform:scale(1.06) rotate(3deg)}}
  @keyframes tide{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
  @keyframes rain{from{transform:translateY(-18px);opacity:.2}to{transform:translateY(22px);opacity:.8}}
  @keyframes ribbon{from{transform:rotate(-.5deg)}to{transform:rotate(.8deg)}}
  @keyframes float{from{transform:translateY(-4px)}to{transform:translateY(6px)}}
  @media (prefers-reduced-motion:reduce){.anim,.spin-slow,.drift-slow,.breathe,.twinkle,.rain-drop,.tide-band,.ribbon,.bloom-petal,.orbit-stage,.title,.kicker,.subtitle,.rule{animation:none!important;transform:none!important;opacity:1!important}}</style>
  <rect width="1600" height="1000" fill="#2B2118"/>
  <g fill="none" stroke="#C9A227" stroke-width="1.2" opacity=".35"><circle cx="1280" cy="250" r="256"/><circle cx="1280" cy="250" r="176"/><circle cx="1280" cy="250" r="96"/></g>
  <g class="stage"><g class="constellation-stage"><circle class="twinkle" style="--i:0" cx="192" cy="100" r="2" fill="#F2E6C9" opacity=".85"/><circle class="twinkle" style="--i:1" cx="329" cy="183" r="3" fill="#F2E6C9" opacity=".85"/><circle class="twinkle" style="--i:2" cx="466" cy="266" r="4" fill="#F2E6C9" opacity=".85"/><circle class="twinkle" style="--i:3" cx="603" cy="349" r="2" fill="#F2E6C9" opacity=".85"/><circle class="twinkle" style="--i:4" cx="740" cy="432" r="3" fill="#F2E6C9" opacity=".85"/><circle class="twinkle" style="--i:5" cx="877" cy="515" r="4" fill="#F2E6C9" opacity=".85"/><circle class="twinkle" style="--i:6" cx="1014" cy="598" r="2" fill="#F2E6C9" opacity=".85"/><circle class="twinkle" style="--i:7" cx="1151" cy="101" r="3" fill="#F2E6C9" opacity=".85"/><circle class="twinkle" style="--i:8" cx="1288" cy="184" r="4" fill="#F2E6C9" opacity=".85"/><circle class="twinkle" style="--i:9" cx="209" cy="267" r="2" fill="#F2E6C9" opacity=".85"/><circle class="twinkle" style="--i:10" cx="346" cy="350" r="3" fill="#F2E6C9" opacity=".85"/><circle class="twinkle" style="--i:11" cx="483" cy="433" r="4" fill="#F2E6C9" opacity=".85"/><g fill="none" stroke="#2E4A7D" stroke-width="1" opacity=".4"><path d="M288 220 576 400 800 280 1088 460 1312 300"/></g><g opacity=".35" fill="none" stroke="#4E7A63" stroke-width="1.5"><circle cx="1024" cy="440" r="319"/><circle cx="1024" cy="440" r="374"/></g></g></g>
  <g class="title-block">
    <text class="kicker anim" x="128" y="632.1777777777778" text-anchor="start" font-family="IM Fell English" font-size="15" letter-spacing="4" fill="#F2E6C9" opacity=".7">FOLIO 07 · BESTIARIO</text>
    <text class="title anim" x="128" y="720" text-anchor="start" font-family="UnifrakturMaguntia" font-size="77.03703703703704" letter-spacing=".01em" fill="#F2E6C9" style="text-transform:none"><tspan x="128" dy="0">Animal inexistente</tspan></text>
    <text class="subtitle anim" x="128" y="791.762962962963" text-anchor="start" font-family="IM Fell English" font-size="18" fill="#F2E6C9" opacity=".78">Una taxonomía de lo que todavía no tiene nombre</text>
    <g class="rule anim" aria-hidden="true"><path d="M128 810.0888888888888h170" stroke="#C9A227" stroke-width="1"/></g>
  </g>
  <text x="1472" y="75" text-anchor="end" font-family="IM Fell English" font-size="13" letter-spacing="3" fill="#F2E6C9" opacity=".7">OPEN/BEAUTY</text><text x="128" y="940" font-family="IM Fell English" font-size="12" letter-spacing="2" fill="#F2E6C9" opacity=".6">SVG original · sin stock</text><filter id="m-grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1600" height="1000" filter="url(#m-grain)" opacity=".035"/>
</svg>